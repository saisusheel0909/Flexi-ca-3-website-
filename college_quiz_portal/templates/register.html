{% extends "base.html" %}

{% block title %}Register Account - CampusQuiz Portal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <!-- Card Header -->
        <div class="p-8 pb-6 text-center border-b border-slate-100 bg-slate-50/50">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/25 mb-3">
                <i class="fa-solid fa-user-plus text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Create Account</h2>
            <p class="text-sm text-slate-500 mt-1">Join CampusQuiz to access online tests & leaderboards</p>
        </div>

        <!-- Registration Form -->
        <form method="POST" action="{{ url_for('register') }}" class="p-8 pt-6 space-y-4">
            <div>
                <label for="full_name" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Full Name
                </label>
                <input type="text" id="full_name" name="full_name" required
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm bg-slate-50 focus:bg-white transition"
                       placeholder="e.g. John Doe">
            </div>

            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Username / Roll Number
                </label>
                <input type="text" id="username" name="username" required
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm bg-slate-50 focus:bg-white transition"
                       placeholder="e.g. 21CS101 or alexcarter">
            </div>

            <div>
                <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    College Email Address
                </label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm bg-slate-50 focus:bg-white transition"
                       placeholder="student@college.edu">
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Password
                </label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm bg-slate-50 focus:bg-white transition"
                       placeholder="••••••••">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Account Role
                </label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition">
                        <input type="radio" name="role" value="student" checked class="text-brand-600 focus:ring-brand-500">
                        <span class="ml-2 text-sm font-medium text-slate-700">👨‍🎓 Student</span>
                    </label>
                    <label class="flex items-center p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition">
                        <input type="radio" name="role" value="admin" class="text-brand-600 focus:ring-brand-500">
                        <span class="ml-2 text-sm font-medium text-slate-700">👨‍🏫 Faculty</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-md shadow-brand-500/20 transition-all flex items-center justify-center space-x-2 mt-2">
                <span>Create My Account</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Footer link -->
        <div class="p-4 bg-slate-50 border-t border-slate-100 text-center text-xs text-slate-500">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="font-semibold text-brand-600 hover:underline">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
