{% extends "base.html" %}

{% block title %}Sign In - CampusQuiz Portal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <!-- Card Header -->
        <div class="p-8 pb-6 text-center border-b border-slate-100 bg-slate-50/50">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/25 mb-3">
                <i class="fa-solid fa-lock text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Welcome Back</h2>
            <p class="text-sm text-slate-500 mt-1">Sign in to start taking quizzes or manage assessments</p>
        </div>

        <!-- Quick Demo Credentials Helper Pill -->
        <div class="p-4 mx-6 mt-6 bg-slate-50 border border-dashed border-slate-300 rounded-xl">
            <p class="text-xs font-semibold text-slate-500 mb-2 flex items-center justify-between">
                <span><i class="fa-solid fa-wand-magic-sparkles text-amber-500 mr-1"></i> Quick Test Auto-Fill:</span>
            </p>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button type="button" onclick="fillCredentials('student1', 'student123')" class="px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-slate-700 hover:border-brand-500 hover:text-brand-600 font-medium transition text-left">
                    👨‍🎓 Student Demo
                </button>
                <button type="button" onclick="fillCredentials('admin', 'admin123')" class="px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-slate-700 hover:border-brand-500 hover:text-brand-600 font-medium transition text-left">
                    👨‍🏫 Faculty Demo
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login') }}" class="p-8 pt-6 space-y-4">
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Username / Roll No
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" name="username" required
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm bg-slate-50 focus:bg-white transition"
                           placeholder="e.g. student1 or roll number">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Password
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-key"></i>
                    </span>
                    <input type="password" id="password" name="password" required
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm bg-slate-50 focus:bg-white transition"
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-md shadow-brand-500/20 transition-all flex items-center justify-center space-x-2 mt-2">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Footer link -->
        <div class="p-4 bg-slate-50 border-t border-slate-100 text-center text-xs text-slate-500">
            Don't have an account yet? 
            <a href="{{ url_for('register') }}" class="font-semibold text-brand-600 hover:underline">Register here</a>
        </div>
    </div>
</div>

<script>
function fillCredentials(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
}
</script>
{% endblock %}
